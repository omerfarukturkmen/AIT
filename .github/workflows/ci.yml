name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + AI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ai/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r ai/requirements-dev.txt httpx pip-audit
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: AI tests
        working-directory: ai
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Generated translations are up to date
        run: git diff --exit-code -- lib/l10n
      - run: flutter analyze lib test
      - run: flutter test
