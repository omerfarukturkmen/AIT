name: flutter_application_1
description: "AIT: AI destekli egzersiz form analizi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  video_player: ^2.8.2
  camera: ^0.11.0+2
  flutter_tts: ^4.2.5
  http: ^1.6.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  flutter_secure_storage: ^10.3.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/ait_icon.png
  # Anton (SIL OFL 1.1, assets/fonts/OFL.txt): the AIT COACH wordmark,
  # headings and big numbers.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
