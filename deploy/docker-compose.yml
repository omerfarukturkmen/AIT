# Production stack: API + PostgreSQL + Caddy (automatic HTTPS).
#   cp deploy/.env.example deploy/.env   # fill in the values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# NOTE: written without a local Docker install; test before production use.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ait:${POSTGRES_PASSWORD}@db:5432/ait
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      ALLOWED_HOSTS: ${API_DOMAIN}
      ALLOWED_ORIGINS: ${WEB_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS}
      VIDEO_RETENTION_DAYS: ${VIDEO_RETENTION_DAYS:-30}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ait
      POSTGRES_USER: ait
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ait -d ait"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  uploads:
  pgdata:
  caddy_data:
